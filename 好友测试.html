<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>测测《后会友期》里你的好朋友最有可能是谁？</title>
<style>
  :root{

    --ink:#4A4640;
    --ink-light:#8F8880;
    --line:#EDE7DF;
    --accent:#B8A99A;
    --accent-soft:#F1EAE2;
    --mint:#C7D6CB;
    --mint-soft:#EDF3EE;
    --blue-soft:#E9EFF4;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    font-size:16px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    padding:0 22px 40px;
    display:flex;
    flex-direction:column;
  }

  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}

  .cover{
    justify-content:center;
    text-align:center;
    padding:60px 0 40px;
  }
  .cover-tag{
    display:inline-block;
    font-size:12px;
    letter-spacing:2px;
    color:var(--accent);

    padding:5px 16px;
    border-radius:999px;
    margin-bottom:28px;
  }

    font-size:26px;
    font-weight:600;
    line-height:1.55;
    letter-spacing:.5px;
  }
  .cover h1 em{
    font-style:normal;
    color:#A08E7B;
    background:linear-gradient(transparent 62%, #F2E6D8 62%);
  }
  .cover-sub{
    margin-top:18px;
    font-size:14px;
    color:var(--ink-light);
    line-height:1.9;
  }
  .cover-deco{
    margin:34px auto 30px;
    width:60px;
    height:1px;
    background:var(--line);
  }
  .cover-note{
    font-size:12.5px;
    color:#B3ABA2;
    line-height:1.9;
  }
  .btn{
    display:block;
    width:100%;
    border:none;
    border-radius:16px;
    padding:16px;
    font-size:16px;
    font-family:inherit;
    font-weight:500;
    letter-spacing:1px;
    cursor:pointer;
    transition:transform .12s ease,opacity .12s ease;
  }
  .btn:active{transform:scale(.985);opacity:.88;}
  .btn-primary{
    background:#B6A695;
    color:#fff;
    box-shadow:0 6px 18px rgba(182,166,149,.28);
  }
  .btn-ghost{
    background:transparent;
    color:var(--ink-light);
    border:1px solid var(--line);
  }
  .cover .btn{margin-top:36px;}

  .quiz{padding-top:26px;}
  .quiz-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .quiz-count{
    font-size:13px;
    color:var(--ink-light);
    letter-spacing:1px;
  }
  .quiz-count b{color:#A08E7B;font-weight:600;font-size:17px;}
  .back-btn{
    background:none;border:none;font-size:13px;color:#C0B8AF;
    font-family:inherit;padding:6px 0;cursor:pointer;
  }
  .progress{
    height:4px;
    background:var(--line);
    border-radius:99px;
    overflow:hidden;
    margin-bottom:34px;
  }
  .progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#D9CBBB,#B8A99A);
    border-radius:99px;
    transition:width .3s ease;
  }
  .q-title{
    font-size:19px;
    font-weight:600;
    line-height:1.65;
    margin-bottom:28px;
    letter-spacing:.3px;
  }
  .q-title span{
    display:block;
    font-size:12px;
    font-weight:400;
    color:#C0B8AF;
    letter-spacing:2px;
    margin-bottom:10px;
  }
  .options{display:flex;flex-direction:column;gap:12px;flex:1;}
  .option{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:16px 18px;
    font-size:15px;
    line-height:1.6;
    color:var(--ink);
    text-align:left;
    font-family:inherit;
    cursor:pointer;
    display:flex;
    align-items:flex-start;
    gap:12px;
    transition:all .16s ease;
  }
  .option .dot{
    flex:0 0 8px;
    width:8px;height:8px;
    border-radius:50%;
    background:var(--line);
    margin-top:9px;
    transition:background .16s ease;
  }
  .option.selected{
    background:var(--mint-soft);
    border-color:var(--mint);
  }
  .option.selected .dot{background:#8FAF9B;}
  .quiz-bottom{padding-top:26px;}

  .result{padding-top:40px;}
  .result-label{
    font-size:12px;
    letter-spacing:3px;
    color:#C0B8AF;
    text-align:center;
    margin-bottom:14px;
  }
  .result-name{
    font-size:30px;
    font-weight:600;
    text-align:center;
    letter-spacing:1px;
    line-height:1.4;
    color:#8C7A67;
  }
  .result-role{
    text-align:center;
    font-size:13.5px;
    color:var(--ink-light);
    margin-top:10px;
    letter-spacing:1px;
  }
  .result-match{
    text-align:center;
    margin-top:18px;
  }
  .match-pill{
    display:inline-block;
    font-size:12.5px;
    color:#8FAF9B;
    background:var(--mint-soft);
    padding:6px 18px;
    border-radius:999px;
    letter-spacing:1px;
  }
  .card{
    background:var(--card);
    border-radius:20px;
    padding:24px 22px;
    margin-top:26px;
    border:1px solid #F3EEE8;
  }
  .card h3{
    font-size:13px;
    font-weight:600;
    letter-spacing:2px;
    color:#A08E7B;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h3::before{
    content:"";
    width:14px;height:1px;
    background:#D9CBBB;
    display:inline-block;
  }
  .card p{
    font-size:14.5px;
    line-height:2;
    color:#5C574F;
  }
  .card p + p{margin-top:10px;}
  .card.warm{background:#FDF7F1;border-color:#F5EADF;}
  .card.cool{background:var(--blue-soft);border-color:#DFE8F0;}
  .keyword-row{
    display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;
  }
  .keyword{
    font-size:12.5px;
    color:#8C7A67;
    background:var(--accent-soft);
    padding:5px 14px;
    border-radius:999px;
  }
  .result-actions{
    margin-top:34px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .footer-note{
    text-align:center;
    font-size:11.5px;
    color:#CBC4BB;
    margin-top:26px;
    line-height:1.8;
    letter-spacing:.5px;
  }

  .result > *{animation:fadeUp .42s ease both;}
  .result > *:nth-child(2){animation-delay:.05s;}
  .result > *:nth-child(3){animation-delay:.09s;}
  .result > *:nth-child(4){animation-delay:.13s;}
  .result > *:nth-child(5){animation-delay:.17s;}
  .result > *:nth-child(6){animation-delay:.21s;}
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
</style>
</head>
<body>
<div class="app">

  <section class="screen cover active" id="screen-cover">
    <span class="cover-tag">后会友期 · 好友匹配</span>
    <h1>测测《后会友期》里<br>你的好朋友<em>最有可能是谁</em>？</h1>
    <div class="cover-deco"></div>
    <p class="cover-sub">
      15 道小题，聊聊你的社交电量、相处习惯和小脾气<br>
      看看节目里，谁最接得住真实的你
    </p>
    <button class="btn btn-primary" onclick="startQuiz()">开始测试</button>
    <p class="cover-note">约 2 分钟 · 凭第一直觉作答更准哦</p>
  </section>

  <section class="screen quiz" id="screen-quiz">
    <div class="quiz-top">
      <div class="quiz-count"><b id="q-index">1</b> / 15</div>
      <button class="back-btn" id="back-btn" onclick="prevQuestion()">上一题</button>
    </div>
    <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
    <h2 class="q-title"><span id="q-tag">QUESTION</span><em id="q-title-text" style="font-style:normal"></em></h2>
    <div class="options" id="options"></div>
    <div class="quiz-bottom">
      <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()" disabled style="opacity:.4">下一题</button>
    </div>
  </section>

  <section class="screen result" id="screen-result">
    <div class="result-label">你 在 节 目 里 的 最 佳 好 友</div>
    <div class="result-name" id="r-name">——</div>
    <div class="result-role" id="r-role"></div>
    <div class="result-match"><span class="match-pill" id="r-match"></span></div>

    <div class="card warm">
      <h3>你为什么会和 TA 成为好朋友</h3>
      <p id="r-why"></p>
    </div>

    <div class="card">
      <h3>TA 最戳你的那个点</h3>
      <p id="r-charm"></p>
      <div class="keyword-row" id="r-keywords"></div>
    </div>

    <div class="card cool">
      <h3>相处小提醒</h3>
      <p id="r-tips"></p>
    </div>

    <div class="result-actions">
      <button class="btn btn-primary" onclick="restart()">重新测试</button>
      <button class="btn btn-ghost" onclick="shareTip()">截图保存分享</button>
    </div>
    <p class="footer-note">仅供娱乐 · 真实的好友关系永远由你们自己定义</p>
  </section>

</div>

    name: "青稚",
    role: "节目里的「慢热治愈派」",
    match: "适配度 94% · 和 TA 待着很安心",
    why: "你不太喜欢热闹，也不爱刻意社交，而青稚刚好也是那种安安静静的人。你们待在一起，不说话也不尴尬。",
    charm: "TA 身上有一种让人放松的气质。你不需要在 TA 面前表演开朗，也不用解释自己为什么想一个人待着。",
    keywords: ["治愈", "慢热", "不尴尬"],
    tips: "TA 不太主动，容易让人觉得有距离。你偶尔往前迈一小步，TA 会记在心里。"
  },
  {
    id: "R8",
    name: "白小纯",
    role: "节目里的「快乐小狗派」",
    match: "适配度 88% · 被单纯治愈",
    why: "你容易把事想复杂，而白小纯是那种简单直接、快乐来得也简单的人。和 TA 相处，你会被带着回到很轻松的状态。",
    charm: "TA 的开心很真，喜欢你就直说，不玩心眼。你 emo 的时候，TA 一个搞笑视频或者一句傻话就能把你逗笑。",
    keywords: ["单纯", "搞笑", "快乐小狗"],
    tips: "TA 心思简单，别用太复杂的弯弯绕去猜 TA。有话直说，反而最合 TA 的节奏。"
  }
];

const TYPE_TO_RESULT = {
  E: { R3: 2, R5: 2, R8: 2, R2: 3 },
  I: { R1: 4, R4: 3, R6: 0.8, R7: 2 },
  S: { R1: 3, R4: 4, R6: 1, R7: 1 },
  F: { R3: 1, R5: 2, R8: 2, R2: 2 },
  R: { R2: 3, R3: 2, R4: 3 }
};

let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);

const $ = id => document.getElementById(id);

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0,0);
}

function startQuiz(){
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  renderQuestion();
  showScreen('screen-quiz');
}

function renderQuestion(){
  const q = QUESTIONS[current];

  $('q-index').textContent = current + 1;
  $('q-tag').textContent = 'Q' + (current + 1) + ' · ' + q.tag;
  $('q-title-text').textContent = q.title;

  $('progress-bar').style.width = ((current) / QUESTIONS.length * 100) + '%';

  const box = $('options');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.innerHTML = '<span class="dot"></span><span>' + opt.text + '</span>';
    if (answers[current] === i) btn.classList.add('selected');
    btn.onclick = () => selectOption(i);
    box.appendChild(btn);
  });

  updateNextBtn();
  $('back-btn').style.visibility = current === 0 ? 'hidden' : 'visible';
}

function selectOption(i){
  answers[current] = i;
  const opts = $('options').children;
  for (let k = 0; k < opts.length; k++){
    opts[k].classList.toggle('selected', k === i);
  }
  updateNextBtn();

  setTimeout(() => {
    if (answers[current] === i) nextQuestion();
  }, 260);
}

function updateNextBtn(){
  const btn = $('next-btn');
  const ok = answers[current] !== null;
  btn.disabled = !ok;
  btn.style.opacity = ok ? '1' : '.4';
  btn.textContent = (current === QUESTIONS.length - 1) ? '查看结果' : '下一题';
}

function nextQuestion(){
  if (answers[current] === null) return;
  if (current < QUESTIONS.length - 1){
    current++;
    renderQuestion();
  } else {
    computeResult();
  }
}

function prevQuestion(){
  if (current > 0){
    current--;
    renderQuestion();
  }
}

function computeResult(){
  const typeScore = { E:0, I:0, S:0, F:0, R:0 };
  answers.forEach((ansIdx, qi) => {
    const type = QUESTIONS[qi].options[ansIdx].type;
    if (typeScore[type] !== undefined) typeScore[type]++;
  });

  const score = {};
  RESULTS.forEach(r => score[r.id] = 0);

  Object.keys(typeScore).forEach(type => {
    const weight = TYPE_TO_RESULT[type];
    Object.keys(weight).forEach(rid => {
      score[rid] += typeScore[type] * weight[rid];
    });
  });

  const seed = answers.reduce((a, b, i) => a + (b + 1) * (i + 3), 0);
  RESULTS.forEach((r, idx) => {
    score[r.id] += ((seed * (idx + 7)) % 11) / 10;
  });

  let best = RESULTS[0].id;
  let bestScore = -1;
  Object.keys(score).forEach(rid => {
    if (score[rid] > bestScore){
      bestScore = score[rid];
      best = rid;
    }
  });

  const result = RESULTS.find(r => r.id === best);
  renderResult(result);
  showScreen('screen-result');
}

function renderResult(r){
  $('r-name').textContent = r.name;
  $('r-role').textContent = r.role;
  $('r-match').textContent = r.match;
  $('r-why').textContent = r.why;
  $('r-charm').textContent = r.charm;
  $('r-tips').textContent = r.tips;

  const kw = $('r-keywords');
  kw.innerHTML = '';
  r.keywords.forEach(k => {
    const span = document.createElement('span');
    span.className = 'keyword';
    span.textContent = k;
    kw.appendChild(span);
  });
}

function restart(){
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  showScreen('screen-cover');
}

function shareTip(){
  alert('小提示：直接截屏保存结果页，就能分享到小红书啦～');
}
</script>
