<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FBF7F2">
<title>测测你朋友里，谁最可能是那个让你又爱又恨的损友</title>
<style>
  :root{
    --bg:#FBF7F2;
    --card:#FFFFFF;
    --ink:#3E3A34;
    --ink-2:#8A8177;
    --ink-3:#BBB2A7;
    --line:#EFE7DC;
    --accent:#BF6F4A;
    --accent-soft:#F8E7DC;
    --warm:#FDF4EC;
    --warm-line:#F3E2D2;
    --cool:#EDF2F6;
    --cool-line:#DCE7EF;
    --warn:#FFF7EA;
    --warn-line:#EAD3A6;
    --warn-ink:#A9762D;
    --match-ink:#6F8F79;
    --match-soft:#EDF4EE;
    --shadow:rgba(160,120,90,.16);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#171513;
      --card:#211E1B;
      --ink:#EDE7DF;
      --ink-2:#A9A096;
      --ink-3:#7C746B;
      --line:#2E2A26;
      --accent:#D98A63;
      --accent-soft:#2E2320;
      --warm:#231C17;
      --warm-line:#3A2C22;
      --cool:#1B2228;
      --cool-line:#27333C;
      --warn:#241E14;
      --warn-line:#4A3A21;
      --warn-ink:#E0B273;
      --match-ink:#8FB39A;
      --match-soft:#1E2621;
      --shadow:rgba(0,0,0,.4);
    }
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:16px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:contain;
    transition:background .2s ease,color .2s ease;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100dvh;
    padding:0 22px calc(36px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
  }

  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}

  /* ---------- 封面 ---------- */
  .cover{
    justify-content:center;
    text-align:center;
    padding:56px 0 32px;
  }
  .cover-tag{
    display:inline-block;
    font-size:12px;
    letter-spacing:2px;
    color:var(--accent);
    background:var(--accent-soft);
    padding:5px 16px;
    border-radius:999px;
    margin-bottom:26px;
  }
  .cover h1{
    font-size:26px;
    font-weight:600;
    line-height:1.55;
    letter-spacing:.5px;
  }
  .cover h1 em{
    font-style:normal;
    color:var(--accent);
    background:linear-gradient(transparent 64%, var(--accent-soft) 64%);
  }
  .cover-sub{
    margin-top:18px;
    font-size:14px;
    color:var(--ink-2);
    line-height:1.9;
  }
  .cover-deco{
    margin:30px auto 26px;
    width:56px;
    height:1px;
    background:var(--line);
  }
  .cover-note{
    font-size:12.5px;
    color:var(--ink-3);
    line-height:1.9;
    margin-top:14px;
  }

  /* ---------- 按钮 ---------- */
  .btn{
    display:block;
    width:100%;
    border:none;
    border-radius:16px;
    padding:16px;
    font-size:16px;
    font-family:inherit;
    font-weight:500;
    letter-spacing:1px;
    cursor:pointer;
    transition:transform .12s ease,opacity .12s ease,background .2s ease;
  }
  .btn:active{transform:scale(.985);opacity:.88;}
  .btn-primary{
    background:var(--accent);
    color:#fff;
    box-shadow:0 8px 20px var(--shadow);
  }
  .btn-ghost{
    background:transparent;
    color:var(--ink-2);
    border:1px solid var(--line);
  }
  .cover .btn{margin-top:32px;}

  /* ---------- 答题 ---------- */
  .quiz{padding-top:24px;}
  .quiz-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
    min-height:32px;
  }
  .quiz-count{
    font-size:13px;
    color:var(--ink-2);
    letter-spacing:1px;
  }
  .quiz-count b{color:var(--accent);font-weight:600;font-size:17px;}
  .back-btn{
    background:none;border:none;font-size:13px;color:var(--ink-3);
    font-family:inherit;padding:6px 0;cursor:pointer;
    visibility:hidden;
  }
  .progress{
    height:4px;
    background:var(--line);
    border-radius:99px;
    overflow:hidden;
    margin-bottom:32px;
  }
  .progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#E5C0A6,var(--accent));
    border-radius:99px;
    transition:width .3s ease;
  }
  .q-title{
    font-size:19px;
    font-weight:600;
    line-height:1.65;
    margin-bottom:26px;
    letter-spacing:.3px;
  }
  .q-title span{
    display:block;
    font-size:12px;
    font-weight:400;
    color:var(--ink-3);
    letter-spacing:2px;
    margin-bottom:10px;
  }
  .options{display:flex;flex-direction:column;gap:12px;flex:1;}
  .option{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:16px 18px;
    font-size:15px;
    line-height:1.6;
    color:var(--ink);
    text-align:left;
    font-family:inherit;
    cursor:pointer;
    display:flex;
    align-items:flex-start;
    gap:12px;
    min-height:44px;
    transition:all .16s ease;
  }
  .option .dot{
    flex:0 0 8px;
    width:8px;height:8px;
    border-radius:50%;
    background:var(--line);
    margin-top:9px;
    transition:background .16s ease;
  }
  .option.selected{
    background:var(--accent-soft);
    border-color:var(--accent);
  }
  .option.selected .dot{background:var(--accent);}
  .quiz-bottom{padding-top:24px;}

  /* ---------- 结果 ---------- */
  .result{padding-top:36px;}
  .result-label{
    font-size:12px;
    letter-spacing:3px;
    color:var(--ink-3);
    text-align:center;
    margin-bottom:12px;
  }
  .result-name{
    font-size:29px;
    font-weight:600;
    text-align:center;
    letter-spacing:1px;
    line-height:1.4;
    color:var(--accent);
  }
  .result-role{
    text-align:center;
    font-size:13.5px;
    color:var(--ink-2);
    margin-top:10px;
    letter-spacing:.5px;
  }
  .result-badges{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-top:16px;
  }
  .pill{
    display:inline-block;
    font-size:12.5px;
    padding:6px 14px;
    border-radius:999px;
    letter-spacing:.5px;
    line-height:1.5;
  }
  .pill-match{color:var(--match-ink);background:var(--match-soft);}
  .pill-lose{color:var(--warn-ink);background:var(--warn);border:1px solid var(--warn-line);}
  .hit-line{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-3);
    margin-top:12px;
    letter-spacing:.3px;
  }

  .card{
    background:var(--card);
    border-radius:20px;
    padding:22px 20px;
    margin-top:24px;
    border:1px solid var(--line);
  }
  .card h3{
    font-size:13px;
    font-weight:600;
    letter-spacing:2px;
    color:var(--accent);
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card h3::before{
    content:"";
    width:14px;height:1px;
    background:var(--accent);
    opacity:.5;
    display:inline-block;
  }
  .card p{
    font-size:14.5px;
    line-height:2;
    color:var(--ink);
  }
  .card.warm{background:var(--warm);border-color:var(--warm-line);}
  .card.cool{background:var(--cool);border-color:var(--cool-line);}
  .keyword-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;}
  .keyword{
    font-size:12.5px;
    color:var(--accent);
    background:var(--accent-soft);
    padding:5px 14px;
    border-radius:999px;
  }
  .warn{
    margin-top:20px;
    padding:16px 18px;
    border:1px dashed var(--warn-line);
    background:var(--warn);
    border-radius:14px;
  }
  .warn-tag{
    display:inline-block;
    font-size:11.5px;
    letter-spacing:2px;
    color:var(--warn-ink);
    margin-bottom:6px;
  }
  .warn p{
    font-size:14px;
    line-height:1.9;
    color:var(--ink);
  }
  .result-actions{
    margin-top:30px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .footer-note{
    text-align:center;
    font-size:11.5px;
    color:var(--ink-3);
    margin-top:22px;
    line-height:1.8;
    letter-spacing:.5px;
  }

  @keyframes fadeUp{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }
  #screen-result > *{animation:fadeUp .42s ease both;}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;
    left:50%;
    bottom:calc(32px + env(safe-area-inset-bottom));
    transform:translate(-50%,14px);
    background:rgba(30,26,22,.92);
    color:#fff;
    font-size:13.5px;
    padding:11px 20px;
    border-radius:999px;
    opacity:0;
    pointer-events:none;
    transition:opacity .24s ease,transform .24s ease;
    max-width:82vw;
    text-align:center;
    z-index:99;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}

  @media (max-width:360px){
    .cover h1{font-size:23px;}
    .result-name{font-size:26px;}
    .card p{font-size:14px;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
  ::selection{background:var(--accent-soft);}
</style>
</head>
<body>
<div class="app">

  <section class="screen cover active" id="screen-cover">
    <span class="cover-tag">损友鉴定所 · 第 01 期</span>
    <h1>测测你朋友里<br>谁最可能是那个<br><em>让你又爱又恨的损友</em></h1>
    <div class="cover-deco"></div>
    <p class="cover-sub">
      15 道题，聊聊你们的相处现场<br>
      看看你最容易被哪种人拿捏
    </p>
    <button class="btn btn-primary" onclick="startQuiz()">开始测试</button>
    <p class="cover-note">约 2 分钟 · 凭第一直觉作答更准</p>
  </section>

  <section class="screen quiz" id="screen-quiz">
    <div class="quiz-top">
      <div class="quiz-count"><b id="q-index">1</b> / 15</div>
      <button class="back-btn" id="back-btn" onclick="prevQuestion()">上一题</button>
    </div>
    <div class="progress"><div class="progress-bar" id="progress-bar"></div></div>
    <h2 class="q-title"><span id="q-tag">QUESTION</span><em id="q-title-text" style="font-style:normal"></em></h2>
    <div class="options" id="options"></div>
    <div class="quiz-bottom">
      <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()" disabled>下一题</button>
    </div>
  </section>

  <section class="screen result" id="screen-result">
    <div class="result-label">你 的 头 号 损 友</div>
    <div class="result-name" id="r-name">——</div>
    <div class="result-role" id="r-role"></div>
    <div class="result-badges">
      <span class="pill pill-match" id="r-match"></span>
      <span class="pill pill-lose" id="r-lose"></span>
    </div>
    <p class="hit-line" id="r-hits"></p>

    <div class="card warm">
      <h3>为什么会成为朋友</h3>
      <p id="r-why"></p>
    </div>

    <div class="card">
      <h3>TA 最戳你的点</h3>
      <p id="r-charm"></p>
      <div class="keyword-row" id="r-keywords"></div>
    </div>

    <div class="card cool">
      <h3>相处建议</h3>
      <p id="r-tips"></p>
    </div>

    <div class="warn">
      <span class="warn-tag">翻 车 预 警</span>
      <p id="r-warning"></p>
    </div>

    <div class="result-actions">
      <button class="btn btn-primary" onclick="shareResult()">分享给这个损友</button>
      <button class="btn btn-ghost" onclick="restart()">重新测试</button>
    </div>
    <p class="footer-note">仅供娱乐 · 损归损，真出事第一个到的还是 TA</p>
  </section>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* DATA:START */
const QUESTIONS = [
  {
    tag: "深夜来电",
    title: "凌晨一点半，手机响了。你希望接起来是哪一种？",
    options: [
      { text: "「喂！我跟你说个巨离谱的事！」——话没说完自己先笑场", type: "R1" },
      { text: "「你睡了吗？他又没回我」——然后连打了三通", type: "R5" },
      { text: "「我在你楼下，穿件外套下来，吃烧烤」", type: "R8" },
      { text: "（未接来电）……第二天：「昨晚睡了」", type: "R4" }
    ]
  },
  {
    tag: "60 秒语音",
    title: "你发了一条 60 秒语音，最想收到哪种回复？",
    options: [
      { text: "三条更长的语音，最后还问你「你刚说的那个是谁来着」", type: "R1" },
      { text: "「你第三句就错了，我列了三点，你听一下」", type: "R2" },
      { text: "「三天后：哈哈哈刚看到，笑死」", type: "R4" },
      { text: "没回，第二天见面第一句是「你昨天说的那个事，后来呢」", type: "R3" }
    ]
  },
  {
    tag: "借钱",
    title: "朋友开口借 2000，哪种说法你最难拒绝？",
    options: [
      { text: "「就这一次，真的急，月底必须还你」", type: "R6" },
      { text: "「等我这个作业交了就有钱，就这两天」——那作业已经拖了三周", type: "R7" },
      { text: "「你还记得上次那笔吗？我们先对一下账」", type: "R2" },
      { text: "「不借也行，但你得听我把这件事讲完」——然后他讲了自己", type: "R5" }
    ]
  },
  {
    tag: "一起吃饭",
    title: "和朋友吃饭，哪种人你其实还能忍？",
    options: [
      { text: "到了才发现他带了另外五个朋友", type: "R1" },
      { text: "点完菜就开始刷手机，全程不说话", type: "R4" },
      { text: "最后一刻说「我可能来不了」", type: "R7" },
      { text: "抢着买单，然后说「下次你请」", type: "R6" }
    ]
  },
  {
    tag: "吐槽",
    title: "你被老师或领导怼了，在群里吐槽。你最想看到哪句？",
    options: [
      { text: "「他算什么东西」——比你还气", type: "R1" },
      { text: "「说重点：他哪句不对，你该怎么回」", type: "R2" },
      { text: "「你先别说了，我懂」——然后陪你沉默十分钟", type: "R3" },
      { text: "「分了吧」——等等，这是作业，不是对象", type: "R5" }
    ]
  },
  {
    tag: "你难过的时候",
    title: "你难过的时候，最希望朋友做什么？",
    options: [
      { text: "安静陪着，不问也不劝", type: "R3" },
      { text: "直接给你一条能执行的处理方案", type: "R2" },
      { text: "什么都不说，把外卖点了，备注「少辣」", type: "R8" },
      { text: "陪你熬到天亮，然后俩人一起迟到", type: "R7" }
    ]
  },
  {
    tag: "出门旅行",
    title: "一起出去玩，你希望对方是哪种人？",
    options: [
      { text: "什么都行，到了再说，走丢了再找", type: "R7" },
      { text: "钱的事他全包，你只负责玩", type: "R6" },
      { text: "人群里他能一眼找到你", type: "R8" },
      { text: "你走累了会问「要不要坐会儿」，然后陪你坐半小时，一句不催", type: "R3" }
    ]
  },
  {
    tag: "小群",
    title: "你们的小群里，你最离不开哪种人？",
    options: [
      { text: "只在关键时刻出现，第一句是「你别慌，我在」", type: "R8" },
      { text: "永远只回一个表情包", type: "R4" },
      { text: "每次有人 emo，他第一个接话", type: "R3" },
      { text: "每次发红包的都是他（虽然只有 8 块 8）", type: "R6" }
    ]
  },
  {
    tag: "迟到",
    title: "朋友迟到 20 分钟，哪种解释你会真的不生气？",
    options: [
      { text: "「睡过头了」——然后第二天提前半小时到", type: "R7" },
      { text: "「我提前到了，在楼下等你」——他其实一直都提前到", type: "R8" },
      { text: "「堵车」——而他家离得最近", type: "R4" },
      { text: "「我刚分手，在楼下哭了一会儿」", type: "R5" }
    ]
  },
  {
    tag: "恋爱参谋",
    title: "朋友的感情出问题，你最吃哪种反应？",
    options: [
      { text: "先听你说完，再问「你想要什么结果」", type: "R2" },
      { text: "把聊天记录逐句标注，分析到凌晨两点", type: "R5" },
      { text: "「别分析了，出来喝一杯」", type: "R1" },
      { text: "「你先哭，哭完我陪你骂」", type: "R3" }
    ]
  },
  {
    tag: "期末周",
    title: "期末周，哪种朋友你最想拥有？",
    options: [
      { text: "和你一起熬到最后一天，互相拖后腿", type: "R7" },
      { text: "自己的早做完了，顺手把你的也做了", type: "R8" },
      { text: "每隔一小时发一句「进度？」", type: "R2" },
      { text: "回你「在写了在写了」，然后消失", type: "R4" }
    ]
  },
  {
    tag: "聚会",
    title: "一屋子十几个人的聚会，你希望谁在场？",
    options: [
      { text: "进门五分钟就认识了一半人", type: "R1" },
      { text: "全场只有他在赶 deadline，电脑都带来了", type: "R7" },
      { text: "拉着你分析在场谁和谁在暧昧，分析得眉飞色舞", type: "R5" },
      { text: "负责把账单 AA 到小数点后两位", type: "R6" }
    ]
  },
  {
    tag: "吵架",
    title: "你们闹别扭了，哪种和好方式你受用？",
    options: [
      { text: "发个表情包，就当无事发生", type: "R4" },
      { text: "直接说「刚才那句我说重了」", type: "R2" },
      { text: "先让你把话说完，中间一句都没打断", type: "R3" },
      { text: "先骂你一顿，再抱着你哭", type: "R1" }
    ]
  },
  {
    tag: "深夜朋友圈",
    title: "凌晨三点你发了条丧气朋友圈，你希望？",
    options: [
      { text: "秒赞，然后连发三条「怎么了怎么了怎么了」", type: "R1" },
      { text: "评论「你是不是又因为他」——明明你俩这次吵的是作业", type: "R5" },
      { text: "第二天打电话：「我看到你朋友圈了，出来吃早饭」", type: "R8" },
      { text: "只点了个赞，什么都没说", type: "R4" }
    ]
  },
  {
    tag: "最后一道",
    title: "朋友之间最不能缺的是什么？",
    options: [
      { text: "随叫随到", type: "R8" },
      { text: "说真话，哪怕难听", type: "R2" },
      { text: "能一起浪费时间", type: "R7" },
      { text: "钱上不含糊", type: "R6" }
    ]
  }
];

const RESULTS = [
  {
    id: "R1",

/* ============ 状态 ============ */
const TOTAL = QUESTIONS.length;
const BASE_TITLE = "测测你朋友里，谁最可能是那个让你又爱又恨的损友";
let current = 0;
let answers = new Array(TOTAL).fill(null);
let lastResult = null;

const $ = id => document.getElementById(id);

/* ============ 屏幕切换 ============ */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}

/* ============ 答题流程 ============ */
function startQuiz(){
  current = 0;
  answers = new Array(TOTAL).fill(null);
  renderQuestion();
  showScreen('screen-quiz');
}

function renderQuestion(){
  const q = QUESTIONS[current];
  const answered = answers.filter(a => a !== null).length;

  $('q-index').textContent = current + 1;
  $('q-tag').textContent = 'Q' + (current + 1) + ' · ' + q.tag;
  $('q-title-text').textContent = q.title;
  $('progress-bar').style.width = (answered / TOTAL * 100) + '%';

  const box = $('options');
  box.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'option';
    if (answers[current] === i) btn.classList.add('selected');
    const dot = document.createElement('span');
    dot.className = 'dot';
    const label = document.createElement('span');
    label.textContent = opt.text;
    btn.appendChild(dot);
    btn.appendChild(label);
    btn.addEventListener('click', () => selectOption(i));
    box.appendChild(btn);
  });

  $('back-btn').style.visibility = current === 0 ? 'hidden' : 'visible';
  updateNextBtn();
}

function selectOption(i){
  answers[current] = i;
  const opts = $('options').children;
  for (let k = 0; k < opts.length; k++){
    opts[k].classList.toggle('selected', k === i);
  }
  updateNextBtn();
  $('progress-bar').style.width = (answers.filter(a => a !== null).length / TOTAL * 100) + '%';

  const idx = current;
  const isLast = idx === TOTAL - 1;
  if (!isLast){
    setTimeout(() => {
      if (current === idx && answers[idx] === i) nextQuestion();
    }, 240);
  }
}

function updateNextBtn(){
  const btn = $('next-btn');
  const ok = answers[current] !== null;
  btn.disabled = !ok;
  btn.style.opacity = ok ? '1' : '.4';
  btn.textContent = (current === TOTAL - 1) ? '查看结果' : '下一题';
}

function nextQuestion(){
  if (answers[current] === null) return;
  if (current < TOTAL - 1){
    current++;
    renderQuestion();
  } else {
    finish();
  }
}

function prevQuestion(){
  if (current > 0){
    current--;
    renderQuestion();
  }
}

/* ============ 计分（确定性） ============ */
function computeResult(){
  const score = {};
  RESULTS.forEach(r => { score[r.id] = 0; });

  answers.forEach((optIndex, qi) => {
    const type = QUESTIONS[qi].options[optIndex].type;
    if (score[type] !== undefined) score[type]++;
  });

  // 平票破平：以答案序列做确定性种子，同一份答案永远同一结果
  const seed = answers.reduce((acc, v, i) => acc + (v + 1) * (i + 3), 0);

  let best = RESULTS[0];
  let bestScore = -Infinity;
  RESULTS.forEach((r, idx) => {
    // 抖动 < 1，只在同分时起作用；乘数与 11 互质，避免某个结果永远吃零
    const jitter = ((seed * (idx + 3) + idx * 5) % 11) / 10;
    const s = score[r.id] + jitter;
    if (s > bestScore){
      bestScore = s;
      best = r;
    }
  });

  return { result: best, hits: score[best.id] };
}

function finish(){
  const { result, hits } = computeResult();
  renderResult(result, hits);
  showScreen('screen-result');
  try {
    history.replaceState(null, '', location.pathname + location.search + '#r=' + result.id);
  } catch (e) { /* file:// 下部分浏览器会拒，忽略 */ }
}

/* ============ 结果渲染 ============ */
function renderResult(r, hits){
  lastResult = r;
  $('r-name').textContent = r.name;
  $('r-role').textContent = r.role;
  $('r-match').textContent = r.match;
  $('r-lose').textContent = r.lose;
  $('r-why').textContent = r.why;
  $('r-charm').textContent = r.charm;
  $('r-tips').textContent = r.tips;
  $('r-warning').textContent = r.warning;

  const kw = $('r-keywords');
  kw.innerHTML = '';
  r.keywords.forEach(k => {
    const span = document.createElement('span');
    span.className = 'keyword';
    span.textContent = k;
    kw.appendChild(span);
  });

  const hitLine = $('r-hits');
  if (hits === null || hits === undefined){
    hitLine.textContent = '这是别人分享给你的结果 · 自己测一遍，看是不是你';
  } else {
    hitLine.textContent = '你答的 ' + TOTAL + ' 题里，有 ' + hits + ' 题指向这个损友';
  }

  const kids = document.querySelectorAll('#screen-result > *');
  kids.forEach((el, i) => { el.style.animationDelay = (i * 40) + 'ms'; });

  document.title = '我的头号损友是「' + r.name + '」';
}

/* ============ 分享 / 路由 ============ */
function shareResult(){
  if (!lastResult) return;
  const url = location.href.split('#')[0] + '#r=' + lastResult.id;
  const text = '我的头号损友是「' + lastResult.name + '」——' + lastResult.lose;

  const fallback = () => {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(() => {
        toast('链接已复制，发给那个损友吧');
      }).catch(() => { window.prompt('复制这个链接发给 TA：', url); });
    } else {
      window.prompt('复制这个链接发给 TA：', url);
    }
  };

  if (navigator.share){
    navigator.share({ title: document.title, text: text, url: url }).then(() => {
      toast('已发出，等着被骂吧');
    }).catch(err => {
      if (err && err.name === 'AbortError') return;
      fallback();
    });
    return;
  }
  fallback();
}

function routeFromHash(){
  const m = location.hash.match(/^#r=(R\d)$/);
  if (!m) return false;
  const r = RESULTS.find(x => x.id === m[1]);
  if (!r) return false;
  renderResult(r, null);
  showScreen('screen-result');
  return true;
}

function restart(){
  current = 0;
  answers = new Array(TOTAL).fill(null);
  lastResult = null;
  document.title = BASE_TITLE;
  try {
    history.replaceState(null, '', location.pathname + location.search);
  } catch (e) { /* ignore */ }
  showScreen('screen-cover');
}

/* ============ 小提示 ============ */
let toastTimer = null;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

/* ============ 启动 ============ */
window.addEventListener('hashchange', () => {
  if (!routeFromHash()) return;
});
if (!routeFromHash()){
  showScreen('screen-cover');
}
</script>
